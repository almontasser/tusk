<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>PHP Editor</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <aside id="sidebar">
      <nav id="side-tabs" role="tablist">
        <button role="tab" data-view="project" class="active">Project</button>
        <button role="tab" data-view="commit">Commit</button>
        <button role="tab" data-view="prs">Pull Requests</button>
        <button role="tab" data-view="search">Find</button>
      </nav>
      <section id="view-project">
        <div id="project">No folder open.</div>
        <button id="open-folder">Open Folder…</button>
        <ul id="tree" role="tree"></ul>
      </section>
      <section id="view-commit" hidden>
        <p id="git-empty">This folder isn't a git repository.</p>
        <div id="git-changes">
          <header class="git-group">Staged <span id="staged-count"></span><button id="unstage-all" title="Unstage all">−</button></header>
          <ul id="staged" class="git-files"></ul>
          <header class="git-group">Changes <span id="changes-count"></span><button id="stage-all" title="Stage all">+</button></header>
          <ul id="changes" class="git-files"></ul>
          <textarea id="commit-message" placeholder="Commit message (⌘⏎ to commit)" aria-label="Commit message"></textarea>
          <label class="amend"><input type="checkbox" id="amend" /> Amend the last commit</label>
          <div class="commit-buttons">
            <button id="commit">Commit</button>
            <button id="commit-push">Commit and Push</button>
          </div>
        </div>
      </section>
      <section id="view-search" hidden>
        <div class="search-form">
          <div class="search-row">
            <input id="find-query" placeholder="Find in files" aria-label="Find in files" spellcheck="false" />
            <button id="opt-case" title="Match case" aria-pressed="false">Aa</button>
            <button id="opt-word" title="Whole words" aria-pressed="false">W</button>
            <button id="opt-regex" title="Regular expression" aria-pressed="false">.*</button>
          </div>
          <div class="search-row">
            <input id="replace-with" placeholder="Replace with ($1 in regex mode)" aria-label="Replace with" spellcheck="false" />
            <button id="replace-all" title="Replace all matches">Replace All</button>
          </div>
          <input id="find-include" placeholder="Files to include, such as *.php, app/**" aria-label="Files to include" spellcheck="false" />
        </div>
        <p id="find-summary"></p>
        <ul id="find-results"></ul>
      </section>
      <section id="view-prs" hidden>
        <div id="pr-list-view">
          <div class="pr-toolbar">
            <select id="pr-filter" aria-label="Filter pull requests">
              <option value="open">Open</option>
              <option value="mine">Created by me</option>
              <option value="review">Review requested</option>
            </select>
            <button id="pr-refresh" title="Refresh">↻</button>
            <button id="pr-create" title="Create a pull request">New</button>
          </div>
          <ul id="pr-list"></ul>
        </div>
        <div id="pr-detail" hidden></div>
      </section>
    </aside>
    <main>
      <nav id="tabs" role="tablist"></nav>
      <div id="editor"></div>
      <div id="history" hidden>
        <header>
          <span id="history-title">Git Log</span>
          <input id="history-filter" placeholder="Filter by message, author, hash, or branch" aria-label="Filter commits" spellcheck="false" />
          <label><input type="checkbox" id="history-all" /> All branches</label>
          <button id="history-close" aria-label="Close history">×</button>
        </header>
        <div class="history-body">
          <div class="history-commits">
            <ul id="history-list"></ul>
            <button id="history-more" hidden>Load More</button>
          </div>
          <div id="history-detail"></div>
        </div>
      </div>
      <div id="diff" hidden>
        <header><span id="diff-path"></span><span id="diff-label"></span><button id="diff-open">Open File</button><button id="diff-close" aria-label="Close diff">×</button></header>
        <div id="diff-editor"></div>
      </div>
      <section id="panel" hidden>
        <div id="panel-resize"></div>
        <nav id="terminal-tabs" role="tablist"></nav>
        <div id="terminals"></div>
      </section>
      <footer id="status"><span id="path"></span><span id="lsp-status"></span><button id="branch-pr" hidden></button><button id="branch" hidden></button></footer>
    </main>
  </body>
</html>
