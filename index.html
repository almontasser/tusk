<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>PHP Editor</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <aside id="sidebar">
      <div id="project">No folder open.</div>
      <button id="open-folder">Open Folder…</button>
      <ul id="tree" role="tree"></ul>
    </aside>
    <main>
      <nav id="tabs" role="tablist"></nav>
      <div id="editor"></div>
      <section id="panel" hidden>
        <div id="panel-resize"></div>
        <nav id="terminal-tabs" role="tablist"></nav>
        <div id="terminals"></div>
      </section>
      <footer id="status"><span id="path"></span><span id="lsp-status"></span></footer>
    </main>
  </body>
</html>
