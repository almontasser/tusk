<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="icon" href="{{favicon}}">
<style>
  /* Tusk's icon colors: indigo #8288DC → #5157BD → #2B2E7C, and ivory #FAF4E4. */
  :root {
    color-scheme: light dark;
    --bg: #f5f5fc;
    --text: #17183d;
    --muted: #595c86;
    --faint: #8f92b8;
    --grid: rgba(81, 87, 189, 0.10);
    --glow: rgba(130, 136, 220, 0.45);
    --glass: rgba(255, 255, 255, 0.72);
    --edge: rgba(81, 87, 189, 0.18);
    --accent: #5157bd;
    --chip: rgba(81, 87, 189, 0.10);
    --code-top: #2b2e7c;
    --code-bottom: #8288dc;
    --live: #16a34a;
    --signal: #5157bd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c1e;
      --text: #ececf8;
      --muted: #a5a8d2;
      --faint: #6d709c;
      --grid: rgba(130, 136, 220, 0.09);
      --glow: rgba(81, 87, 189, 0.55);
      --glass: rgba(23, 24, 56, 0.62);
      --edge: rgba(130, 136, 220, 0.20);
      --accent: #aeb2f2;
      --chip: rgba(130, 136, 220, 0.16);
      --code-top: #faf4e4;
      --code-bottom: #8288dc;
      --live: #4ade80;
      --signal: #8288dc;
    }
  }
  /* Not answering: the signal turns amber. */
  .down { --signal: #d97706; }
  @media (prefers-color-scheme: dark) { .down { --signal: #fbbf24; } }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* A glow from the top over a faint grid that fades out toward the edges. */
  .backdrop { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .backdrop::before, .backdrop::after { content: ""; position: absolute; inset: 0; }
  .backdrop::before {
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    background-position: center top;
    -webkit-mask-image: radial-gradient(ellipse 75% 60% at 50% 25%, #000 25%, transparent 75%);
    mask-image: radial-gradient(ellipse 75% 60% at 50% 25%, #000 25%, transparent 75%);
  }
  .backdrop::after { background: radial-gradient(55% 45% at 50% 0%, var(--glow), transparent 70%); }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding: 56px 24px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .logo { width: 76px; height: 76px; filter: drop-shadow(0 14px 30px var(--glow)); animation: float 5s ease-in-out infinite; }
  .logo svg { width: 100%; height: 100%; display: block; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .code {
    margin: 6px 0 2px;
    font-size: clamp(104px, 24vw, 176px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.06em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--code-top) 15%, var(--code-bottom) 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    user-select: none;
  }
  h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.3; font-weight: 650; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  h1 code { font-size: 0.92em; font-weight: 600; color: var(--accent); background: var(--chip); padding: 2px 10px; border-radius: 10px; }
  .lead { margin: 0; max-width: 460px; font-size: 16px; line-height: 1.6; color: var(--muted); }
  .lead code { color: var(--text); }

  .actions { margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .run {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px 13px 18px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(180deg, #7076d6, #4b51b6);
    color: #fff;
    font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 10px 28px var(--glow), 0 2px 6px rgba(43, 46, 124, 0.35);
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
  }
  .run code { font-size: 14px; font-weight: 600; }
  .run:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .run:active { transform: translateY(0); filter: brightness(0.96); }
  .run:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .run:disabled { cursor: default; filter: saturate(0.7); transform: none; }
  /* A play triangle, and a spinner while it starts. */
  .glyph { width: 0; height: 0; border-style: solid; border-width: 7px 0 7px 11px; border-color: transparent transparent transparent #fff; }
  .busy .glyph { width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { font-size: 12.5px; color: var(--faint); }
  .hint.error { color: #e5484d; }

  .waiting {
    margin-top: 26px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px 8px 14px;
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    font-size: 13px;
    color: var(--muted);
  }
  .signal { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--signal); }
  .signal::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--signal); animation: ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite; }
  @keyframes ping { 0% { transform: scale(1); opacity: 0.6; } 80%, 100% { transform: scale(3); opacity: 0; } }

  .running { margin-top: 36px; width: 100%; }
  .running h2 { margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  .running ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .running a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--edge);
    border-radius: 12px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--text);
    font-size: 13.5px;
    text-decoration: none;
    transition: border-color 0.15s, transform 0.15s;
  }
  .running a::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 22%, transparent); }
  .running a::after { content: "→"; color: var(--faint); transition: transform 0.15s, color 0.15s; }
  .running a:hover { border-color: var(--accent); transform: translateY(-1px); }
  .running a:hover::after { color: var(--accent); transform: translateX(2px); }
  .running a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer { position: relative; z-index: 1; padding: 20px 24px 28px; text-align: center; font-size: 12px; color: var(--faint); }
  footer b { font-weight: 600; color: var(--muted); }

  @media (max-height: 640px) { main { justify-content: flex-start; padding-top: 32px; } }
  @media (prefers-reduced-motion: reduce) {
    .logo, .signal::after { animation: none; }
    .running a, .running a::after, .run { transition: none; }
    .busy .glyph { animation-duration: 2.4s; }
  }
</style>
</head>
<body class="{{tone}}">
<div class="backdrop" aria-hidden="true"></div>
<main>
  <div class="logo" aria-hidden="true">{{icon}}</div>
  <div class="code" aria-hidden="true">{{code}}</div>
  <h1><code>{{host}}</code> isn't {{verb}}</h1>
  <p class="lead">{{explanation}}</p>{{action}}
  <div class="waiting" role="status"><span class="signal"></span><span id="waiting">{{waiting}}</span></div>{{running}}
</main>
<footer><b>Tusk</b> · local proxy · {{code}} {{reason}}</footer>
<script>
  (function () {
    var timer, busy = false;
    function later() {
      clearTimeout(timer);
      timer = setTimeout(poll, 2000);
    }
    function poll() {
      clearTimeout(timer);
      if (document.hidden || busy) return;
      busy = true;
      fetch(location.href, { cache: "no-store" }).then(function (r) {
        if (r.headers.get("X-Tusk-Proxy") !== "unavailable") return location.reload();
        busy = false;
        later();
      }, function () {
        busy = false;
        later();
      });
    }
    document.addEventListener("visibilitychange", poll);
    later();

    // Asks Tusk to run the configuration that serves this address; the polling above opens the site once it's up.
    var run = document.getElementById("run");
    if (!run) return;
    var hint = document.getElementById("run-hint"), label = document.getElementById("run-label"), waiting = document.getElementById("waiting");
    var idle = { hint: hint.textContent, label: label.innerHTML, waiting: waiting.textContent };
    function reset(message) {
      run.disabled = false;
      run.classList.remove("busy");
      label.innerHTML = idle.label;
      waiting.textContent = idle.waiting;
      hint.textContent = message || idle.hint;
      hint.classList.toggle("error", !!message);
    }
    run.addEventListener("click", function () {
      run.disabled = true;
      run.classList.add("busy");
      label.textContent = "Starting…";
      hint.textContent = idle.hint;
      hint.classList.remove("error");
      fetch("/__tusk/run", { method: "POST", headers: { "X-Tusk": "run" } }).then(function (r) {
        if (!r.ok) return reset("Tusk couldn't run it from here. Run it from Tusk instead.");
        waiting.textContent = "Starting in Tusk";
        poll();
        // Tusk may be asking a question, such as your password the first time. Let you try again after a while.
        setTimeout(function () { reset(); }, 20000);
      }, function () {
        reset("Tusk didn't answer. Is it still open?");
      });
    });
  })();
</script>
</body>
</html>
