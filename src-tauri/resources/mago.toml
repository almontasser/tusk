# Default Mago configuration for projects without their own mago.toml.
# A project's mago.toml replaces this file completely.

[source]
# The editor sends one file at a time on standard input. Mago reads `paths` as the project's
# own code and `includes` as library code, and uses both as context, so project classes and
# framework classes such as Laravel facades resolve. Don't list project folders in
# `includes`: Mago never lints included files. The editor replaces "." with the project's top-level
# folders and PHP files, less hidden ones, vendor, node_modules, and storage, since Mago walks every
# file under a path before it applies `excludes`.
paths = ["."]
# The editor adds Laravel's alias stubs (`use DB;`) to this list, so keep it on one line.
includes = ["vendor"]
# Hidden folders can hold whole copies of the project, such as git worktrees in .claude/. The editor adds
# vendor files it gives Mago corrected copies of, so keep this on one line too. AWS's API data and Carbon's
# translations are arrays that declare nothing, and AWS's alone is over a third of a typical vendor folder.
excludes = [".*", "node_modules", "storage", "bootstrap/cache", "vendor/aws/aws-sdk-php/src/data", "vendor/nesbot/carbon/src/Carbon/Lang"]

[linter]
integrations = ["laravel"]

# Rules that flag idiomatic Laravel code on almost every file.
[linter.rules]
strict-types = { enabled = false }
literal-named-argument = { enabled = false }
# Filament and the container fill a closure's parameters by name (`$record`, `$livewire`), which a first-class
# callable such as `$this->print(...)` renames to the method's.
prefer-first-class-callable = { enabled = false }
# Code size and complexity are hints to refactor, not errors: warnings, as PhpStorm shows them.
cyclomatic-complexity = { level = "warning" }
kan-defect = { level = "warning" }
too-many-methods = { level = "warning" }
too-many-properties = { level = "warning" }
too-many-enum-cases = { level = "warning" }
excessive-parameter-list = { level = "warning" }
# Style and hardening advice rather than mistakes.
no-empty = { level = "warning" }
no-error-control-operator = { level = "warning" }
final-controller = { level = "warning" }
sensitive-parameter = { level = "warning" }
# Tests, factories, and seeders set passwords for fake users.
no-literal-password = { exclude = ["tests/", "database/factories/", "database/seeders/"] }
