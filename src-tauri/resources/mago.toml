# Default Mago configuration for projects without their own mago.toml.
# A project's mago.toml replaces this file completely.

[source]
# The editor sends one file at a time on standard input. Mago reads `paths` as the project's
# own code and `includes` as library code, and uses both as context, so project classes and
# framework classes such as Laravel facades resolve. Don't list project folders in
# `includes`: Mago never lints included files.
paths = ["."]
includes = ["vendor"]
# Hidden folders can hold whole copies of the project, such as git worktrees in .claude/.
excludes = [".*", "node_modules", "storage", "bootstrap/cache"]

[linter]
integrations = ["laravel"]

# Rules that flag idiomatic Laravel code on almost every file.
[linter.rules]
strict-types = { enabled = false }
literal-named-argument = { enabled = false }
