[package]
name = "php-editor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "FSL-1.1-MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "php_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The PHP language server. The app runs itself with `lsp` to start it (see main.rs).
tusk-lsp = { path = "../tusk-lsp" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tauri-plugin-dialog = "2"
notify = "8"
tauri-plugin-mcp-bridge = "0.13"
ignore = "0.4.33"
grep = "0.4.1"
portable-pty = "0.9.0"
trash = "5.2.9"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
postgres = "0.19.14"
mysql = { version = "28.0.2", default-features = false, features = ["minimal", "native-tls"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
tungstenite = { version = "0.28", features = ["native-tls"] }
base64 = "0.22"
flate2 = "1"
rustc-hash = "2"
# Downloading the language tools. The same versions and features tauri-plugin-updater already builds.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
minisign-verify = "0.2"
sha2 = "0.10"
tar = "0.4"
tauri-plugin-updater = "2.12.0"
chardetng = "1"
encoding_rs = "0.8"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tonic-reflection = { version = "0.14", default-features = false }
prost = "0.14"
protox = "0.9"
tokio-stream = "0.1"
prost-reflect = { version = "0.16", features = ["serde"] }
tokio = { version = "1", features = ["macros", "sync"] }

# Database passwords: the Keychain on macOS, Credential Manager on Windows, the Secret Service on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Ties the language servers to the app's lifetime (a job object), as the watchdog script does elsewhere.
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwinding lets the language server answer a request that panics with an error instead of exiting.
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tonic-reflection = { version = "0.14", features = ["server"] }
tokio-stream = { version = "0.1", features = ["net"] }
