<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="skin" cx="0.42" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#A3ABDC"/>
      <stop offset="1" stop-color="#7780BE"/>
    </radialGradient>
    <radialGradient id="ear" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#8D95CF"/>
      <stop offset="1" stop-color="#6A73B3"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8DBBA"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#23265E" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <!-- Ears -->
    <ellipse cx="262" cy="470" rx="205" ry="235" transform="rotate(-14 262 470)" fill="url(#ear)"/>
    <ellipse cx="762" cy="470" rx="205" ry="235" transform="rotate(14 762 470)" fill="url(#ear)"/>
    <ellipse cx="258" cy="485" rx="130" ry="160" transform="rotate(-14 258 485)" fill="#C3C8EA"/>
    <ellipse cx="766" cy="485" rx="130" ry="160" transform="rotate(14 766 485)" fill="#C3C8EA"/>
    <!-- Head -->
    <ellipse cx="512" cy="455" rx="255" ry="245" fill="url(#skin)"/>
    <ellipse cx="455" cy="330" rx="120" ry="60" transform="rotate(-18 455 330)" fill="#FFFFFF" opacity="0.18"/>
    <!-- Tusks, behind the trunk -->
    <path d="M 454 568 C 440 610 412 648 372 672 C 400 680 440 666 464 634 C 478 614 482 594 480 574 Z" fill="url(#ivory)"/>
    <path d="M 570 568 C 584 610 612 648 652 672 C 624 680 584 666 560 634 C 546 614 542 594 544 574 Z" fill="url(#ivory)"/>
    <!-- Trunk, with a J-shaped tip -->
    <path d="M 512 555 C 512 680 520 770 592 800 C 632 816 672 800 692 770" fill="none" stroke="#8189C6" stroke-width="96" stroke-linecap="round"/>
    <ellipse cx="700" cy="764" rx="12" ry="9" transform="rotate(-40 700 764)" fill="#5C64A6"/>
    <path d="M 474 640 Q 512 654 550 640" fill="none" stroke="#6A73B3" stroke-width="7" stroke-linecap="round"/>
    <path d="M 478 690 Q 516 704 554 688" fill="none" stroke="#6A73B3" stroke-width="7" stroke-linecap="round"/>
    <path d="M 500 744 Q 532 764 566 744" fill="none" stroke="#6A73B3" stroke-width="7" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="432" cy="448" rx="30" ry="40" fill="#1E2150"/>
    <ellipse cx="592" cy="448" rx="30" ry="40" fill="#1E2150"/>
    <circle cx="422" cy="432" r="11" fill="#FFFFFF"/>
    <circle cx="582" cy="432" r="11" fill="#FFFFFF"/>
    <circle cx="440" cy="466" r="5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="600" cy="466" r="5" fill="#FFFFFF" opacity="0.7"/>
    <!-- Cheeks -->
    <ellipse cx="382" cy="530" rx="38" ry="26" fill="#F3A6C4" opacity="0.55"/>
    <ellipse cx="642" cy="530" rx="38" ry="26" fill="#F3A6C4" opacity="0.55"/>
  </g>
</svg>
